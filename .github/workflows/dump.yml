  macos-gcc-output:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: macos default gcc
        run: |
          set -e
          which g++-15
          g++-15 ${GITHUB_WORKSPACE}/test/sort-general.cpp
          ./a.out
          rm a.out
          g++-15 ${GITHUB_WORKSPACE}/test/sort-gcc.cpp
