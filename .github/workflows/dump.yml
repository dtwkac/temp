          echo -e "\033[32m------------------------------ {} 1 > log ------------------------------\033[0m"
          cat log5
          echo -e "\033[32m------------------------------ {} 2 > log ------------------------------\033[0m"
          cat log6
          echo -e "\033[32m------------------------------ {} > log 2>&1 ------------------------------\033[0m"
          cat log7
          echo -e "\033[32m------------------------------ {} &> log ------------------------------\033[0m"
