name: temp

on:
  push:
    paths:
      - '.github/workflows/temp.yml'
  workflow_dispatch:

jobs:
  Temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Temp
        run: |
          set -e
          TZ='Asia/Shanghai' date
          docker run -dit --name temp ubuntu bash
          cat << 'EOF' | docker exec -i temp bash
          apt-get update && \
          apt-get upgrade -y && \
          apt-get autoremove -y && \
          printf '%b' 'y\n' | unminimize && \
          printf '%b' '5\n69\n' | apt-get install -y tzdata && \
          apt-get install -y sudo man-db command-not-found bash-completion vim g++ cmake cgdb git wget curl zip unzip 7zip tree tmux htop calc language-pack-zh-hans openssh-server && \
          apt-get update && \
          update-locale LANG=zh_CN.UTF-8 && \
          mkdir "$HOME/tools" && \
          cd "$HOME/tools" && \
          anaconda_version='2025.12-2' && \
          curl -fLO "https://repo.anaconda.com/archive/Anaconda3-${anaconda_version}-Linux-x86_64.sh" && \
          bash "Anaconda3-${anaconda_version}-Linux-x86_64.sh" -b -p "$HOME/tools/anaconda3" && \
          rm "Anaconda3-${anaconda_version}-Linux-x86_64.sh" && \
          . "$HOME/tools/anaconda3/bin/activate" && \
          conda create -y -n dev python=3
          EOF
