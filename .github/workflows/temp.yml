name: temp

on:
  push:
    paths:
      - '.github/workflows/temp.yml'
  workflow_dispatch:

jobs:
  Temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Temp
        run: |
          set -e
          TZ='Asia/Shanghai' date
          sudo apt update &> /dev/null
          sudo apt install zsh &> /dev/null
          sudo chsh -s $(which zsh)
