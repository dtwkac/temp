name: temp

on:
  push:
    paths:
      - '.github/workflows/temp.yml'
  workflow_dispatch:

jobs:
  Temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Temp
        run: |
          set -e
          TZ='Asia/Shanghai' date
          cat << 'EOF' > Dockerfile
          FROM ubuntu:26.04
          RUN apt-get update &> /dev/null && \
              apt-get upgrade -y &> /dev/null && \
              apt-get install tzdata && \
              DEBIAN_FRONTEND=noninteractive TZ="Asia/Shanghai" dpkg-reconfigure tzdata
          EOF
          docker build -t del .
