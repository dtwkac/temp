name: temp

on:
  push:
    paths:
      - '.github/workflows/temp.yml'
  workflow_dispatch:

jobs:
  Temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Temp
        run: |
          set -e
          TZ='Asia/Shanghai' date
          cat << 'EOF' > Dockerfile
          FROM ubuntu:26.04
          RUN apt update &> /dev/null && \
              apt upgrade -y &> /dev/null && \
              echo -e "\n5\n68" | apt-get install -y tzdata && \
              apt install -y &> neovim g++ python3 && \
              nvim --version && \
              g++ --version && \
              python3 --version
          EOF
