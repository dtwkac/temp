name: temp

on:
  push:
    paths:
      - '.github/workflows/temp.yml'
  workflow_dispatch:

jobs:
  Temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Temp
        run: |
          set -e
          TZ='Asia/Shanghai' date
          sudo apt-get update && \
          sudo apt-get upgrade -y && \
          sudo apt-get install -y curl cmake ninja-build g++ python3 && \
          clang_version='20.1.6' && \
          curl -fLO "https://github.com/llvm/llvm-project/releases/download/llvmorg-${clang_version}/llvm-project-${clang_version}.src.tar.xz" && \
          tar -xf "llvm-project-${clang_version}.src.tar.xz" && \
          cd "llvm-project-${clang_version}.src" && \
          mkdir build && \
          cd build && \
          cmake -G Ninja ../llvm -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_ENABLE_RUNTIMES="compiler-rt;libunwind;libcxxabi;libcxx" && \
          time ninja
