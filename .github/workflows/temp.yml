name: temp

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp.yml'

env:
  GREEN: \033[32m
  PURPLE: \033[35m
  RESET: \033[0m

jobs:
  temp:
    runs-on: ubuntu-latest
    steps:
    - name: temp
      run: |
        set -e
        date

  version-2:
    runs-on: ubuntu-latest
    steps:
    - name: v2rayN 2
      run: |
        set -e
        sudo dpkg --add-architecture i386
        sudo apt update &> /dev/null
        sudo apt install -y wine &> /dev/null
        for ((minor=30; minor<=53; minor++)); do
          echo -e "${PURPLE}-------------------------------- 2.${minor} --------------------------------${RESET}"
          if ! wget -nv https://github.com/2dust/v2rayN/releases/download/2.${minor}/v2rayN-Core.zip 2> error.log; then
            perl -pe 'print "\e[31m"; s/$/\e[0m/' error.log
            continue
          fi
          unzip -q v2rayN-Core.zip
          echo -e "${PURPLE}v2rayN-Core:${RESET}"
          echo -e "${GREEN}wine ${GITHUB_WORKSPACE}/v2rayN-Core/v2ray.exe -version:${RESET}"
          wine ${GITHUB_WORKSPACE}/v2rayN-Core/v2ray.exe -version 2> error.log || perl -pe 'print "\e[31m"; s/$/\e[0m/' error.log
          rm -rf v2rayN-Core v2rayN-Core.zip
        done

  version-3:
    runs-on: ubuntu-latest
    steps:
    - name: v2rayN 3
      run: |
        set -e
        sudo dpkg --add-architecture i386
        sudo apt update &> /dev/null
        sudo apt install -y wine &> /dev/null
        for ((minor=22; minor<=44; minor++)); do
          if ! wget -nv https://github.com/v2fly/v2ray-core/releases/download/v4.${minor}.0/v2ray-linux-64.zip 2> error.log; then
            perl -pe 'print "\e[31m"; s/$/\e[0m/' error.log
            continue
          fi
          unzip -q v2ray-linux-64.zip
          echo -e "${GREEN}wine ${GITHUB_WORKSPACE}/v2ray-linux-64.zip/v2ray.exe -help:${RESET}"
          wine ${GITHUB_WORKSPACE}/v2rayN-Core/v2ray.exe -help 2> error.log || perl -pe 'print "\e[31m"; s/$/\e[0m/' error.log
          rm -rf v2rayN-Core v2rayN-Core.zip
        done

  version-4:
    runs-on: ubuntu-latest
    steps:
    - name: v2rayN 4
      run: |
        set -e
        sudo dpkg --add-architecture i386
        sudo apt update &> /dev/null
        sudo apt install -y wine &> /dev/null
        for ((minor=0; minor<=36; minor++)); do
          echo -e "${PURPLE}-------------------------------- 4.${minor} --------------------------------${RESET}"
          if ! wget -nv https://github.com/2dust/v2rayN/releases/download/4.${minor}/v2rayN-Core.zip 2> error.log; then
            perl -pe 'print "\e[31m"; s/$/\e[0m/' error.log
            continue
          fi
          unzip -q v2rayN-Core.zip
          echo -e "${PURPLE}v2rayN-Core:${RESET}"
          echo -e "${GREEN}wine ${GITHUB_WORKSPACE}/v2rayN-Core/v2ray.exe -version:${RESET}"
          wine ${GITHUB_WORKSPACE}/v2rayN-Core/v2ray.exe -version 2> error.log || perl -pe 'print "\e[31m"; s/$/\e[0m/' error.log
          if [ "${minor}" -ge 9 ]; then
            echo -e "${GREEN}wine ${GITHUB_WORKSPACE}/v2rayN-Core/xray.exe version:${RESET}"
            wine ${GITHUB_WORKSPACE}/v2rayN-Core/xray.exe version 2> error.log || perl -pe 'print "\e[31m"; s/$/\e[0m/' error.log
          fi
          rm -rf v2rayN-Core v2rayN-Core.zip
        done

  version-5:
    runs-on: ubuntu-latest
    steps:
    - name: v2rayN 5
      run: |
        set -e
        sudo dpkg --add-architecture i386
        sudo apt update &> /dev/null
        sudo apt install -y wine &> /dev/null
        for ((minor=0; minor<=39; minor++)); do
          echo -e "${PURPLE}-------------------------------- 5.${minor} --------------------------------${RESET}"
          if ! wget -nv https://github.com/2dust/v2rayN/releases/download/5.${minor}/v2rayN-Core.zip 2> error.log; then
            perl -pe 'print "\e[31m"; s/$/\e[0m/' error.log
            continue
          fi
          unzip -q v2rayN-Core.zip
          echo -e "${PURPLE}v2rayN-Core:${RESET}"
          if [ "${minor}" -le 5 ]; then
            echo -e "${GREEN}wine ${GITHUB_WORKSPACE}/v2rayN-Core/v2ray.exe -version:${RESET}"
            wine ${GITHUB_WORKSPACE}/v2rayN-Core/v2ray.exe -version 2> error.log || perl -pe 'print "\e[31m"; s/$/\e[0m/' error.log
          else
            echo -e "${GREEN}wine ${GITHUB_WORKSPACE}/v2rayN-Core/v2ray.exe version:${RESET}"
            wine ${GITHUB_WORKSPACE}/v2rayN-Core/v2ray.exe version 2> error.log || perl -pe 'print "\e[31m"; s/$/\e[0m/' error.log
          fi
          echo -e "${GREEN}wine ${GITHUB_WORKSPACE}/v2rayN-Core/xray.exe version:${RESET}"
          wine ${GITHUB_WORKSPACE}/v2rayN-Core/xray.exe version 2> error.log || perl -pe 'print "\e[31m"; s/$/\e[0m/' error.log
          rm -rf v2rayN-Core v2rayN-Core.zip
        done
