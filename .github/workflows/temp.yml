name: temp

on:
  push:
    paths:
      - '.github/workflows/temp.yml'
  workflow_dispatch:

jobs:
  temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: temp
        run: |
          set -e
          date
          echo $DEBIAN_FRONTEND
          which curl
          sudo apt update
          sudo apt install curl
          which curl
          whereis curl
