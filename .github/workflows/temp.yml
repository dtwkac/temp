name: temp

on:
  push:
    paths:
      - '.github/workflows/temp.yml'
  workflow_dispatch:

jobs:
  Temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Temp
        run: |
          set -e
          TZ='Asia/Shanghai' date
          cat << 'EOF' > Dockerfile
          FROM ubuntu:26.04
          WORKDIR /root
          RUN apt-get update && \
              echo '5\n68\n' | script -q -c "apt-get install -y tzdata" /dev/null && \
              mkdir ${HOME}/tools && \
              cd ${HOME}/tools && \
              apt install -y curl && \
              miniforge_version='26.1.1-3' && \
              curl -L -O https://github.com/conda-forge/miniforge/releases/download/${miniforge_version}/Miniforge3-Linux-x86_64.sh && \
              bash Miniforge3-Linux-x86_64.sh -b
          EOF
          docker build -t temp .
