name: temp

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp.yml'

jobs:
  temp:
    runs-on: ubuntu-latest
    steps:
    - name: temp
      run: |
        set -e
        date
        df -h
        set -e
        avail=$(df -h / | awk 'NR==2 {print $4}' | sed 's/G//')
        if [ "$avail" -lt 50 ]; then
          exit 0
        fi
        sudo apt-get update &> /dev/null
        sudo apt-get install -y python3-venv npm &> /dev/null
        mkdir -p ${HOME}/tools
        cd ${HOME}/tools
        wget -nv https://github.com/neovim/neovim/releases/download/v0.11.6/nvim-linux-x86_64.tar.gz
        tar -zxf nvim-linux-x86_64.tar.gz
        rm nvim-linux-x86_64.tar.gz
        echo 'export PATH=$PATH:${HOME}/tools/nvim-linux-x86_64/bin' >> ${HOME}/.bashrc
        git clone https://github.com/LazyVim/starter ${HOME}/.config/nvim
        {
        cat << 'OPTIONS' >> ${HOME}/.config/nvim/lua/config/options.lua
        
        vim.opt.expandtab = true
        vim.opt.shiftwidth = 4
        vim.opt.relativenumber = false
        vim.opt.guicursor = "a:ver25"
        vim.opt.selection = "exclusive"
        OPTIONS
        }
        {
        cat << 'AUTOCMDS' >> ${HOME}/.config/nvim/lua/config/autocmds.lua
        
        vim.api.nvim_create_autocmd({ "ColorScheme", "User" }, {
          pattern = { "*", "LazyVimStarted" },
          callback = function()
            vim.api.nvim_set_hl(0, "CursorLineNr", { fg = "NONE", bg = "NONE" })
          end,
        })
        AUTOCMDS
        }
        {
        cat << 'KEYMAPS' >> ${HOME}/.config/nvim/lua/config/keymaps.lua
        
        vim.keymap.set({'v', 'x'}, '<C-c>', '"+y', { silent = true })
        vim.keymap.set({'n', 'v'}, '<C-v>', '"+p', { silent = true })
        vim.keymap.set('i', '<C-v>', '<C-r>+', { silent = true })
        KEYMAPS
        }
        {
        cat << MASON > ${HOME}/.config/nvim/lua/plugins/mason.lua
        return {
          "mason-org/mason.nvim",
          opts = {
            ensure_installed = {
              "bzl", "clarity-lsp", "coq-lsp", "digestif", "erlang-debugger", "erlang-ls", "fennel-ls", "flux-lsp", "gospel", "haskell-debug-adapter", "hdl-checker", "java-language-server", "luacheck", "luaformatter", "nil", "nimlsp", "ocaml-lsp", "ocamlearlybird", "ocamlformat", "pkgbuild-language-server", "psalm", "r-languageserver", "salt-lsp", "teal-language-server", "vala-language-server", "vls", "vsg", "xcodeprojectcli"
            },
          },
        }
        MASON
        }
        cat ${HOME}/.config/nvim/lua/plugins/mason.lua
        {
        cat << 'BLINK' > ${HOME}/.config/nvim/lua/plugins/blink.lua
        return {
          {
            "saghen/blink.cmp",
            opts = {
              completion = {
                accept = {
                  auto_brackets = { enabled = true },
                },
                menu = {
                  draw = {
                    columns = {
                      { "kind_icon", "label", gap = 1 },
                    },
                  },
                },
                ghost_text = { enabled = false },
              },
              keymap = {
                preset = "none",
                ["<CR>"] = { "fallback" },
                ["<Tab>"] = { "accept", "fallback" },
                ["<C-n>"] = { "select_next", "fallback" },
                ["<C-p>"] = { "select_prev", "fallback" },
                ["<C-Space>"] = { "show", "fallback" },
                ["<C-e>"] = { "hide", "fallback" },
                ["<Up>"] = { "select_prev", "fallback" },
                ["<Down>"] = { "select_next", "fallback" },
              },
            },
          },
        }
        BLINK
        }
        {
        cat << 'LSP' > ${HOME}/.config/nvim/lua/plugins/lsp.lua
        return {
          {
            "neovim/nvim-lspconfig",
            opts = {
              inlay_hints = { enabled = false },
              servers = {
                clangd = {
                  cmd = { "clangd", "--function-arg-placeholders=0" },
                },
                pyright = {},
                ruff = {},
              },
            },
          },
        }
        LSP
        }
        ${HOME}/tools/nvim-linux-x86_64/bin/nvim \
          -c "lua require('lazy').sync({wait = true})" \
          -c "lua
            local mr = require('mason-registry')
            local function check()
              for _, p in ipairs(mr.get_all_packages()) do
                if p:is_installing() then
                  return vim.defer_fn(check, 1000)
                end
              end
              vim.schedule(function() vim.cmd('qa') end)
            end
            mr.refresh(check)" > /dev/null
        echo -e "\033[32mtree -L 1 ${HOME}/.local/share/nvim/mason/packages:\033[0m"
        tree -L 1 ${HOME}/.local/share/nvim/mason/packages
        echo -e "\033[32mdu -sh ${HOME}/.local/share/nvim/mason/packages:\033[0m"
        du -sh ${HOME}/.local/share/nvim/mason/packages
