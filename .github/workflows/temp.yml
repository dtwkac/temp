name: temp

on:
  push:
    paths:
      - '.github/workflows/temp.yml'
  workflow_dispatch:

env:
  GREEN: \033[32m
  PURPLE: \033[35m
  RESET: \033[0m

jobs:
  Temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Temp
        run: |
          set -e
          date
          echo -e "${GREEN}green${RESET}${PURPLE}purple${RESET}${RED}red${RESET}"
