name: temp

on:
  push:
    paths:
      - '.github/workflows/temp.yml'
  workflow_dispatch:

jobs:
  Temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Temp
        run: |
          set -e
          TZ='Asia/Shanghai' date
          # 查看详细的驱动类型
          docker info -f '{{ .DriverStatus }}'
          
          # 或者直接查看存储驱动
          docker info | grep -i "Storage Driver"
