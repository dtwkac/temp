name: temp

on:
  push:
    paths:
      - '.github/workflows/temp.yml'
  workflow_dispatch:

jobs:
  Temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Temp
        run: |
          set -e
          TZ='Asia/Shanghai' date
          cat << 'EOF' | docker run -it ubuntu:24.04 bash
          apt-get update && \
          apt-get upgrade -y && \
          printf '%b' '5\n69\n' | apt-get install -y tzdata && \
          apt-get install -y sudo && \
          mkdir "$HOME/project" && \
          cd "$HOME/project" && \
          printf '%b\n' '\033[32m------------------------------ build cgdb ------------------------------\033[0m' && \
          sudo apt-get install -y git g++ automake make flex texinfo libreadline-dev gdb && \
          git clone https://github.com/cgdb/cgdb.git && \
          cd cgdb && \
          ./autogen.sh && \
          mkdir build && \
          cd build && \
          ../configure && \
          make -j$(nproc) && \
          printf '%b\n' "\033[32m$HOME/project/cgdb/build/cgdb/cgdb --version:\033[0m" && \
          "$HOME/project/cgdb/build/cgdb/cgdb" --version
          EOF
