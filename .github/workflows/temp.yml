name: temp

on:
  push:
    paths:
      - '.github/workflows/temp.yml'
  workflow_dispatch:

jobs:
  Temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Temp
        run: |
          set -e
          TZ='Asia/Shanghai' date
          docker run -it ubuntu bash -c "$(cat << 'EOF'
          { [ -f /.dockerenv ] || { printf '\033[31m%s\033[0m\n' 'Docker environment required. Aborting...' >&2; false; }; } && \
          { ! tmux ls > /dev/null 2>&1 || { printf '\033[31m%s\033[0m\n' 'Tmux session(s) detected. Aborting...' >&2; false; }; } && \
          printf '\033[32m%s\033[0m\n' 'Setting up the environment...' && \
          apt-get update && \
          apt-get upgrade -y && \
          printf '%b' '5\n68\n' | script -q -c 'apt-get install -y tzdata' /dev/null && \
          apt-get install -y sudo && \
          sudo apt-get install -y curl g++ libmpc-dev make flex && \
          gcc_version='12.3.0' && \
          curl -fLO "https://github.com/gcc-mirror/gcc/archive/refs/tags/releases/gcc-${gcc_version}.tar.gz" && \
          tar -zxvf "gcc-${gcc_version}.tar.gz" && \
          rm "gcc-${gcc_version}.tar.gz" && \
          cd "gcc-releases-gcc-${gcc_version}" && \
          mkdir build && \
          cd build && \
          ../configure --disable-multilib && \
          time make -j$(nproc) && \
          unset http_proxy https_proxy
          EOF
          )"

          sudo apt-get update && \
          sudo apt-get upgrade -y && \
          sudo apt-get install -y curl g++ libmpc-dev make flex && \
          gcc_version='12.3.0' && \
          curl -fLO "https://github.com/gcc-mirror/gcc/archive/refs/tags/releases/gcc-${gcc_version}.tar.gz" && \
          tar -zxvf "gcc-${gcc_version}.tar.gz" && \
          rm "gcc-${gcc_version}.tar.gz" && \
          cd "gcc-releases-gcc-${gcc_version}" && \
          mkdir build && \
          cd build && \
          ../configure --disable-multilib && \
          time make -j$(nproc)

          sudo apt-get update && \
          sudo apt-get upgrade -y && \
          sudo apt-get install -y curl cmake ninja-build g++ python3 && \
          clang_version='20.1.6' && \
          curl -fLO "https://github.com/llvm/llvm-project/releases/download/llvmorg-${clang_version}/llvm-project-${clang_version}.src.tar.xz" && \
          tar -xf "llvm-project-${clang_version}.src.tar.xz" && \
          cd "llvm-project-${clang_version}.src" && \
          mkdir build && \
          cd build && \
          cmake -G Ninja ../llvm -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_ENABLE_RUNTIMES="compiler-rt;libunwind;libcxxabi;libcxx" && \
          time ninja
