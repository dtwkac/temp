name: temp

on:
  push:
    paths:
      - '.github/workflows/temp.yml'
  workflow_dispatch:

jobs:
  Temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Temp
        run: |
          set -e
          TZ='Asia/Shanghai' date
          sudo apt-get update
          sudo apt-get upgrade -y
          echo '------------------------------------------------------------------------------------------------'
          cat << 'EOF' > a.sh
          sudo apt-get update && \
          sudo apt-get upgrade -y
          EOF
          bash a.sh

