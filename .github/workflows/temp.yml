name: temp

on:
  push:
    paths:
      - '.github/workflows/temp.yml'
  workflow_dispatch:

jobs:
  Temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Temp
        run: |
          set -e
          TZ='Asia/Shanghai' date
          lsb_release -a
          lscpu
          free -h
          df -h
          ifconfig
