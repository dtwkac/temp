name: temp

on:
  push:
    paths:
      - '.github/workflows/temp.yml'
  workflow_dispatch:

jobs:
  Temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Temp
        run: |
          set -e
          TZ='Asia/Shanghai' date
          sudo apt-get install -y openssh-server
          printf '%s\n' 'PermitRootLogin prohibit-password' > /etc/ssh/sshd_config.d/custom.conf
