name: temp

on:
  push:
    paths:
      - '.github/workflows/temp.yml'
  workflow_dispatch:

jobs:
  Temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Temp
        run: |
          set -e
          TZ='Asia/Shanghai' date
            sudo apt-get update
            sudo apt-get remove -y containerd.io
            sudo apt-get autoremove -y
            sudo apt-get update && \
            sudo apt-get upgrade -y && \
            sudo apt-get autoremove -y && \
            sudo apt-get install -y vim g++ cmake cgdb git wget curl zip unzip 7zip tree tmux htop docker.io language-pack-zh-hans && \
            sudo update-locale LANG=zh_CN.UTF-8

