name: temp

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp.yml'

env:
  GREEN: \033[32m
  PURPLE: \033[35m
  RESET: \033[0m

jobs:
  temp:
    runs-on: ubuntu-latest
    steps:
    - name: temp
      run: |
        date
        sudo dpkg --add-architecture i386
        sudo apt update &> /dev/null
        sudo apt install -y wine &> /dev/null
        for ((minor=0; minor<=46; minor++)); do
          echo $minor:
          if ! wget -nv https://github.com/v2fly/v2ray-core/releases/download/v5.${minor}.0/v2ray-windows-64.zip 2> error.log; then
            perl -pe 'print "\e[31m"; s/$/\e[0m/' error.log
            continue
          fi
          unzip -q -d ${GITHUB_WORKSPACE}/temp v2ray-windows-64.zip
          echo -e "${GREEN}wine ${GITHUB_WORKSPACE}/temp/v2ray.exe -help:${RESET}"
          wine ${GITHUB_WORKSPACE}/temp/v2ray.exe -help
          rm -rf v2ray-windows-64.zip temp
        done
