name: temp

on:
  push:
    paths:
      - '.github/workflows/temp.yml'
  workflow_dispatch:

jobs:
  Temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Temp
        run: |
          set -e
          date
          echo $DEBIAN_FRONTEND
          ls -alhF $(which curl)
          curl --version
          sudo apt update
          sudo apt install curl
          which curl
          curl --version
