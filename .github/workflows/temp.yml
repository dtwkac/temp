name: temp

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp.yml'

jobs:
  temp:
    runs-on: ubuntu-latest
    steps:
    - name: temp
      run: |
        set -e
        GREEN="\033[32m"
        PURPLE="\033[35m"
        RESET="\033[0m"
        date
        sudo apt update &> /dev/null
        sudo apt install -y 7zip wine &> /dev/null
        for ((minor=0; minor<=60; minor++)); do
          echo -e "\033[35m-------------------------------- 6.${minor} --------------------------------\033[0m"
          if [ "${minor}" -lt 2 ]; then
            suffix=""
          elif [ "${minor}" -lt 6 ]; then
            suffix="-Core"
          else
            suffix="-With-Core"
          fi

          if [ "${minor}" -ge 44 ]; then
            mihomo_exe="mihomo-windows-amd64-compatible.exe"
          else
            mihomo_exe="mihomo.exe"
          fi

          if ! wget -nv https://github.com/2dust/v2rayN/releases/download/6.${minor}/v2rayN${suffix}.zip 2> error.log; then
            perl -pe 'print "\e[31m"; s/$/\e[0m/' error.log
            continue
          fi
          unzip -q v2rayN${suffix}.zip
          ls ${GITHUB_WORKSPACE}/v2rayN${suffix}/bin
          rm -rf v2rayN${suffix} v2rayN${suffix}.zip
        done
