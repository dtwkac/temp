name: temp

on:
  push:
    paths:
      - '.github/workflows/temp.yml'
  workflow_dispatch:

jobs:
  Temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Temp
        run: |
          set -e
          date
          REPORT="full_benchmark_$(hostname)_$(date +%Y%m%d_%H%M%S).txt"
          JSON_REPORT="full_benchmark_$(hostname)_$(date +%Y%m%d_%H%M%S).json"
          
          exec > >(tee -a "$REPORT") 2>&1
          
          log() {
            echo -e "\n==================== $1 ====================\n"
          }
          
          log "综合系统性能测试报告"
          echo "主机名: $(hostname)"
          echo "时间: $(date)"
          
          # ======================
          # 系统信息
          # ======================
          log "系统基础信息"
          uname -a
          lsb_release -a 2>/dev/null || cat /etc/os-release
          lscpu
          free -h
          lsblk
          df -hT
          ip a
          ip route
          
          # ======================
          # 依赖
          # ======================
          log "安装依赖工具"
          sudo apt update -y &> /dev/null
          sudo apt install -y \
            sysbench fio iperf3 speedtest-cli curl jq \
            stress-ng psmisc procps dnsutils lmbench &> /dev/null
          
          # ======================
          # CPU
          # ======================
          log "CPU 性能测试"
          
          echo "--- 单核算力 ---"
          sysbench cpu --cpu-max-prime=30000 --threads=1 run
          
          echo "--- 多核算力 ---"
          sysbench cpu --cpu-max-prime=30000 --threads=$(nproc) run
          
          echo "--- 浮点性能 ---"
          sysbench cpu --cpu-max-prime=20000 --threads=$(nproc) run
          
          echo "--- 上下文切换 ---"
          sysbench threads --threads=$(nproc) --thread-yields=100 --thread-locks=2 run
          
          echo "--- 压缩性能 ---"
          echo "Lorem ipsum dolor sit amet..." > /tmp/test.txt
          tar cf - /tmp/test.txt | gzip -9 > /tmp/test.gz
          time gzip -9 -c /tmp/test.txt > /dev/null
          
          # ======================
          # 内存
          # ======================
          log "内存性能测试"
          
          sysbench memory --memory-block-size=1M --memory-total-size=20G run
          sysbench memory --memory-block-size=4K --memory-access-mode=rnd --memory-total-size=10G run
          
          echo "--- memcpy 性能 ---"
          stress-ng --vm 1 --vm-bytes 80% --vm-method memcpy --timeout 30s --metrics-brief
          
          # ======================
          # 磁盘 IO
          # ======================
          log "磁盘 IO 性能测试"
          
          TEST_DIR="/tmp/io_test"
          mkdir -p $TEST_DIR
          cd $TEST_DIR
          
          fio --name=seqwrite --rw=write --bs=1M --size=3G --numjobs=1 --iodepth=64 --direct=1
          fio --name=seqread  --rw=read  --bs=1M --size=3G --numjobs=1 --iodepth=64 --direct=1
          
          fio --name=randwrite --rw=randwrite --bs=4k --size=2G --numjobs=4 --iodepth=64 --direct=1
          fio --name=randread  --rw=randread  --bs=4k --size=2G --numjobs=4 --iodepth=64 --direct=1
          
          echo "--- fsync 性能 ---"
          sysbench fileio --file-total-size=2G prepare
          sysbench fileio --file-total-size=2G --file-test-mode=sync run
          sysbench fileio cleanup
          
          cd /
          rm -rf $TEST_DIR
          
          # ======================
          # 网络
          # ======================
          log "网络性能测试"
          
          echo "--- 带宽测试 ---"
          speedtest-cli --simple
          
          echo "--- 延迟与丢包 ---"
          ping -c 20 8.8.8.8
          ping -c 20 1.1.1.1
          
          echo "--- DNS 解析性能 ---"
          for i in {1..10}; do
            time dig google.com @8.8.8.8 +short
          done
          
          # ======================
          # 系统层性能
          # ======================
          log "系统层性能"
          
          echo "--- 进程创建性能 ---"
          time for i in {1..1000}; do /bin/true; done
          
          echo "--- 管道通信 ---"
          time bash -c 'for i in {1..10000}; do echo test | cat >/dev/null; done'
          
          echo "--- fork 性能 ---"
          stress-ng --fork 4 --timeout 30s --metrics-brief
          
          # ======================
          # 稳定性测试
          # ======================
          log "稳定性压力测试"
          
          stress-ng --cpu $(nproc) --io 4 --vm 2 --vm-bytes 70% --timeout 60s --metrics-brief
          
          # ======================
          # 清理
          # ======================
          log "测试完成"
          echo "报告文件: $REPORT"
