name: temp

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp.yml'

jobs:
  temp:
    runs-on: ubuntu-latest
    steps:
    - name: temp
      run: |
        set -e
        date
        avail=$(df -h / | awk 'NR==2 {print $4}' | sed 's/G//')
        if [ "$avail" -lt 50 ]; then
          df -h
          exit 0
        fi
        rustc --version
        cargo --version
