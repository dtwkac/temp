name: temp

on:
  push:
    paths:
      - '.github/workflows/temp.yml'
  workflow_dispatch:

jobs:
  Temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Temp
        run: |
          set -e
          TZ='Asia/Shanghai' date
              mkdir "$HOME/tools" && \
              cd "$HOME/tools" && \
              anaconda_version='2025.12-2' && \
              curl -fLO "https://repo.anaconda.com/archive/Anaconda3-${anaconda_version}-Linux-x86_64.sh" && \
              bash "Anaconda3-${anaconda_version}-Linux-x86_64.sh" -b -p "$HOME/tools/anaconda3" && \
              rm "Anaconda3-${anaconda_version}-Linux-x86_64.sh" && \
              . "$HOME/tools/anaconda3/bin/activate" && \
              conda create -y -n dev python=3
