name: temp

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp.yml'

jobs:
  temp:
    runs-on: ubuntu-latest
    steps:
    - name: temp
      run: |
        set -e
        date
        df -h
        mkdir ~/tools && \
        cd ~/tools && \
        wget -nv https://github.com/neovim/neovim/releases/download/v0.11.6/nvim-linux-x86_64.tar.gz && \
        tar -zxf nvim-linux-x86_64.tar.gz && \
        rm nvim-linux-x86_64.tar.gz && \
        export PATH=$PATH:${HOME}/tools/nvim-linux-x86_64/bin && \
        git clone https://github.com/LazyVim/starter ~/.config/nvim && \
        ${HOME}/tools/nvim-linux-x86_64/bin/nvim \
          -c "lua require('lazy').sync({wait = true})" \
          -c "qa" && \
        nvim --headless +"lua local r=require('mason-registry'); r.refresh(function() local p=r.get_all_packages(); local t={}; for _,x in ipairs(p) do table.insert(t,x.name) end; table.sort(t); local path=vim.fn.getcwd()..'/mason_packages.txt'; local f=io.open(path,'w'); for _,n in ipairs(t) do f:write(n..'\n') end; f:close(); end)" +qa && \
        wc -l mason_packages.txt && \
        packages=$(sed '/^$/d' mason_packages.txt | paste -sd, - | sed 's/[^,]*/"&"/g')
        echo $packages
