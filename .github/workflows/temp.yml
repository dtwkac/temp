name: temp

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp.yml'

env:
  GREEN: \033[32m
  PURPLE: \033[35m
  RESET: \033[0m

jobs:
  temp:
    runs-on: ubuntu-latest
    steps:
    - name: temp
      run: |
        set -e
        date
        declare -a mydict=([0]=9 [1]=3 [2]=3 [3]=2 [4]=2 [5]=6 [6]=2 [7]=1 [8]=3 [9]=3
                           [10]=5 [11]=3 [12]=7 [13]=8 [14]=12 [15]=7 [16]=9 [17]=3 [18]=0
        )
        for k in "${!mydict[@]}"; do
          echo "$k -> ${mydict[$k]}"
        done
