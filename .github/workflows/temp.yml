name: temp

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp.yml'

jobs:
  temp:
    runs-on: ubuntu-latest
    steps:
    - name: temp
      run: |
        set -e
        date
        sudo apt update &> /dev/null
        sudo apt install -y wine &> /dev/null
        wget -q https://github.com/2dust/v2rayN/releases/download/5.39/v2rayN-Core.zip
        unzip -q v2rayN-Core.zip
        wine v2rayN-Core/clash-windows-amd64.exe -v 2> /dev/null
        wine v2rayN-Core/v2ray.exe version 2> /dev/null
        wine v2rayN-Core/wv2ray.exe version
        wine v2rayN-Core/xray.exe version 2> /dev/null
        wine v2rayN-Core/wxray.exe version 2> /dev/null
