name: temp

on:
  push:
    paths:
      - '.github/workflows/temp.yml'
  workflow_dispatch:

jobs:
  Temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Temp
        run: |
          set -e
          TZ='Asia/Shanghai' date
          docker run hello-world
          docker run -dit ubuntu bash
          echo docker ps:
          docker ps
          echo docker ps -a:
          docker ps -a
          echo docker images:
          docker images
          echo docker info:
          docker info
