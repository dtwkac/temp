name: temp

on:
  push:
    paths:
      - '.github/workflows/temp.yml'
  workflow_dispatch:

jobs:
  Temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Temp
        run: |
          set -e
          TZ='Asia/Shanghai' date
          cat << 'EOF' > Dockerfile
          FROM ubuntu
          WORKDIR /root
          RUN apt-get update &> /dev/null && \
              apt-get upgrade -y &> /dev/null && \
              apt-get autoremove -y &> /dev/null && \
              apt-get install -y unminimize &> /dev/null && \
              printf '%b' 'y\n' | unminimize &> /dev/null && \
              printf '%b' '5\n68\n' | script -q -c 'apt-get install -y tzdata' /dev/null &> /dev/null && \
              apt-get install -y sudo && \
              sudo apt-get install -y man-db command-not-found bash-completion file vim g++ cmake cgdb git wget curl zip unzip 7zip tree tmux htop calc language-pack-zh-hans openssh-server &> /dev/null && \
              sudo apt-get update &> /dev/null && \
              sudo update-locale LANG=zh_CN.UTF-8 &> /dev/null && \
              mkdir "$HOME/tools" && \
              cd "$HOME/tools" && \
              anaconda_version='2025.12-2' && \
              curl -fLO "https://repo.anaconda.com/archive/Anaconda3-${anaconda_version}-Linux-x86_64.sh" && \
              bash "Anaconda3-${anaconda_version}-Linux-x86_64.sh" -b -p "$HOME/tools/anaconda3" && \
              rm "Anaconda3-${anaconda_version}-Linux-x86_64.sh" && \
              . "$HOME/tools/anaconda3/bin/activate" && \
              conda create -y -n dev python=3
          EOF
