name: temp

on:
  push:
    paths:
      - '.github/workflows/temp.yml'
  workflow_dispatch:

jobs:
  Temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Temp
        run: |
          set -e
          TZ='Asia/Shanghai' date
          cat << 'EOF' > Dockerfile
          FROM ubuntu
          WORKDIR /root
          RUN apt-get update && \
              apt-get upgrade -y && \
              apt-get autoremove -y && \
              echo 'y' | unminimize && \
              echo '5\n69\n' | apt-get install -y tzdata && \
              apt-get install -y sudo man-db command-not-found bash-completion vim g++ cmake cgdb git wget curl zip unzip 7zip tree tmux htop calc language-pack-zh-hans openssh-server && \
              apt-get update && \
              echo >> ~/.bashrc && \
              echo 'if ! shopt -oq posix; then' >> ~/.bashrc && \
              echo '  if [ -f /usr/share/bash-completion/bash_completion ]; then' >> ~/.bashrc && \
              echo '    . /usr/share/bash-completion/bash_completion' >> ~/.bashrc && \
              echo '  elif [ -f /etc/bash_completion ]; then' >> ~/.bashrc && \
              echo '    . /etc/bash_completion' >> ~/.bashrc && \
              echo '  fi' >> ~/.bashrc && \
              echo 'fi' >> ~/.bashrc && \
              echo >> ~/.bashrc && \
              echo "export LANG='zh_CN.UTF-8'" >> ~/.bashrc && \
              echo 'filetype plugin indent on' >> ~/.vimrc && \
              echo 'set expandtab' >> ~/.vimrc && \
              echo 'set shiftwidth=4' >> ~/.vimrc && \
              echo 'let loaded_matchparen = 1' >> ~/.vimrc && \
              echo "au BufReadPost * if line(\"'\\\"\") > 1 && line(\"'\\\"\") <= line(\"\$\") | exe \"normal! g\`\\\"\" | endif" >> ~/.vimrc && \
              ssh-keygen -f ~/.ssh/id_ed25519 -N '' && \
              cp ~/.ssh/id_ed25519.pub ~/.ssh/authorized_keys && \
              echo >> /etc/ssh/sshd_config && \
              echo 'PermitRootLogin prohibit-password' >> /etc/ssh/sshd_config && \
              echo 'ClientAliveInterval 60' >> /etc/ssh/sshd_config && \
              echo 'ClientAliveCountMax 3' >> /etc/ssh/sshd_config && \
              service ssh start && \
              mkdir ~/tools && \
              cd ~/tools && \
              anaconda_version='2024.10-1' && \
              curl -L -O https://repo.anaconda.com/archive/Anaconda3-${anaconda_version}-Linux-x86_64.sh && \
              bash Anaconda3-${anaconda_version}-Linux-x86_64.sh -b -p ~/tools/anaconda3 && \
              rm Anaconda3-${anaconda_version}-Linux-x86_64.sh && \
              . ~/tools/anaconda3/bin/activate && \
              conda create -y -n dev python=3 && \
              conda deactivate
          EOF
          docker build -t temp .
