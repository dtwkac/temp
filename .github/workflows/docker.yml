name: docker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'
  push:
    paths:
      - '.github/workflows/docker.yml'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: docker
        run: |
          set -e
          sudo apt-get update &> /dev/null
          sudo apt-get remove -y containerd.io &> /dev/null
          sudo apt-get autoremove -y &> /dev/null
          sudo apt-get install -y docker.io &> /dev/null
          docker run hello-world &> /dev/null
          docker run -dit --rm ubuntu bash &> /dev/null
          docker run -dit --rm ubuntu:26.04 bash &> /dev/null
          cat << 'EOF' > Dockerfile
          FROM ubuntu:26.04
          WORKDIR /root
          RUN apt-get update > /dev/null 2>&1 && \
              apt-get upgrade -y > /dev/null 2>&1 && \
              apt-get autoremove -y > /dev/null 2>&1 && \
              apt-get install -y unminimize > /dev/null 2>&1 && \
              printf '%b' 'y\n' | unminimize > /dev/null 2>&1 && \
              printf '%b' '5\n68\n' | script -q -c 'apt-get install -y tzdata' /dev/null && \
              apt-get install -y sudo man-db command-not-found bash-completion vim neovim g++ cmake cgdb git wget curl zip unzip 7zip tree tmux htop calc language-pack-zh-hans openssh-server > /dev/null 2>&1 && \
              apt-get update > /dev/null 2>&1 && \
              mkdir ${HOME}/tools && \
              cd ${HOME}/tools && \
              miniforge_version='26.1.1-3' && \
              curl -fLO https://github.com/conda-forge/miniforge/releases/download/${miniforge_version}/Miniforge3-Linux-x86_64.sh > /dev/null 2>&1 && \
              bash Miniforge3-Linux-x86_64.sh -b -p ${HOME}/tools/miniforge3 > /dev/null 2>&1 && \
              rm Miniforge3-Linux-x86_64.sh && \
              . ${HOME}/tools/miniforge3/bin/activate > /dev/null 2>&1 && \
              conda create -y -n dev python=3 > /dev/null 2>&1 && \
              conda deactivate && \
              echo "--------------------------------------------------------------------" && \
              nvim --version && \
              echo "--------------------------------------------------------------------" && \
              g++ --version && \
              echo "--------------------------------------------------------------------" && \
              which python3 && \
              $(which python3) --version && \
              echo "--------------------------------------------------------------------" && \
              conda activate dev && \
              which python3 && \
              $(which python3) --version
          EOF
          docker build -t temp .
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedSince}}\t{{.Size}}"
