name: docker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'
  push:
    paths:
      - '.github/workflows/docker.yml'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: docker
        run: |
          set -e
          docker run hello-world &> /dev/null
          docker run -dit --rm ubuntu bash &> /dev/null
          cat << 'EOF' > Dockerfile
          FROM ubuntu:26.04
          WORKDIR /root
          RUN apt-get update && \
              apt-get upgrade -y && \
              apt-get autoremove -y && \
              apt-get install -y unminimize && \
              printf 'y\n' | unminimize && \
              printf '5\n68\n' | script -q -c 'apt-get install -y tzdata' /dev/null && \
              apt-get install -y sudo man-db command-not-found bash-completion vim neovim g++ cmake cgdb git wget curl zip unzip 7zip tree tmux htop calc language-pack-zh-hans openssh-server && \
              apt-get update && \
              echo >> ${HOME}/.bashrc && \
              echo 'if ! shopt -oq posix; then' >> ${HOME}/.bashrc && \
              echo '  if [ -f /usr/share/bash-completion/bash_completion ]; then' >> ${HOME}/.bashrc && \
              echo '    . /usr/share/bash-completion/bash_completion' >> ${HOME}/.bashrc && \
              echo '  elif [ -f /etc/bash_completion ]; then' >> ${HOME}/.bashrc && \
              echo '    . /etc/bash_completion' >> ${HOME}/.bashrc && \
              echo '  fi' >> ${HOME}/.bashrc && \
              echo 'fi' >> ${HOME}/.bashrc && \
              echo >> ${HOME}/.bashrc && \
              echo "export LANG='zh_CN.UTF-8'" >> ${HOME}/.bashrc && \
              echo 'filetype plugin indent on' >> ${HOME}/.vimrc && \
              echo 'set expandtab' >> ${HOME}/.vimrc && \
              echo 'set shiftwidth=4' >> ${HOME}/.vimrc && \
              echo 'let loaded_matchparen = 1' >> ${HOME}/.vimrc && \
              echo "au BufReadPost * if line(\"'\\\"\") > 1 && line(\"'\\\"\") <= line(\"\$\") | exe \"normal! g\`\\\"\" | endif" >> ${HOME}/.vimrc && \
              ssh-keygen -f ${HOME}/.ssh/id_ed25519 -N '' && \
              cp ${HOME}/.ssh/id_ed25519.pub ${HOME}/.ssh/authorized_keys && \
              echo >> /etc/ssh/sshd_config && \
              echo 'PermitRootLogin prohibit-password' >> /etc/ssh/sshd_config && \
              echo 'ClientAliveInterval 60' >> /etc/ssh/sshd_config && \
              echo 'ClientAliveCountMax 3' >> /etc/ssh/sshd_config && \
              service ssh start && \
              mkdir ${HOME}/tools && \
              cd ${HOME}/tools && \
              miniforge_version='26.1.1-3' && \
              curl -L -O https://github.com/conda-forge/miniforge/releases/download/${miniforge_version}/Miniforge3-Linux-x86_64.sh && \
              bash Miniforge3-Linux-x86_64.sh -b -p ${HOME}/tools/miniforge3 && \
              rm Miniforge3-Linux-x86_64.sh && \
              . ${HOME}/tools/miniforge3/bin/activate && \
              conda create -y -n dev python=3 && \
              echo "--------------------------------------------------------------------" && \
              nvim --version && \
              echo "--------------------------------------------------------------------" && \
              g++ --version && \
              echo "--------------------------------------------------------------------" && \
              python3 --version
          EOF
          docker build -t temp .
          docker images
