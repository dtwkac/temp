name: docker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'
  push:
    paths:
      - '.github/workflows/docker.yml'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: docker
        run: |
          set -e
          docker run hello-world &> /dev/null
          docker run -dit --rm ubuntu bash &> /dev/null
          docker images
          cat << 'EOF' | docker run -i --rm ubuntu:26.04 bash
          apt update &> /dev/null
          apt upgrade -y &> /dev/null
          echo -e "\n5\n68" | apt-get install -y tzdata 2> /dev/null && \
          apt install -y &> neovim g++ python3
          nvim --version
          g++ --version
          python3 --version
          EOF
