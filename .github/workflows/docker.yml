name: docker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'
  push:
    paths:
      - '.github/workflows/docker.yml'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: docker
        run: |
          set -e
          docker run hello-world &> /dev/null
          docker run -dit --rm ubuntu bash &> /dev/null
          docker images
          cat << 'EOF' | docker run -i --rm ubuntu:26.04 bash
          apt-get update &> /dev/null
          apt-get upgrade -y &> /dev/null
          apt-get install tzdata
          DEBIAN_FRONTEND=noninteractive TZ="Asia/Shanghai" dpkg-reconfigure tzdata && \
          apt-get install -y neovim g++ python3 &> /dev/null
          nvim --version
          g++ --version
          python3 --version
          EOF
