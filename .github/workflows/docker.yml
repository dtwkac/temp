name: docker

on:
  push:
    paths:
      - '.github/workflows/docker.yml'
  workflow_dispatch:

jobs:
  Temp:
    runs-on: ubuntu-latest
    steps:
      - name: docker
        run: |
          set -e
          docker run hello-world &> /dev/null
          docker run -dit ubuntu bash &> /dev/null
          docker images
