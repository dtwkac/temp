name: docker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'
  push:
    paths:
      - '.github/workflows/docker.yml'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: docker
        run: |
          set -e
          docker run hello-world &> /dev/null
          docker run -dit --rm ubuntu bash &> /dev/null
          docker images
          cat << 'EOF' | docker run -i --rm ubuntu:26.04 bash
          apt-get update &> /dev/null
          apt-get upgrade -y &> /dev/null
          echo "tzdata tzdata/Areas select Asia" | debconf-set-selections && \
          echo "tzdata tzdata/Zones/Asia select Shanghai" | debconf-set-selections && \
          apt-get install -y tzdata && \
          echo "PURGE tzdata" | debconf-communicate
          apt install -y &> neovim g++ python3
          nvim --version
          g++ --version
          python3 --version
          EOF
